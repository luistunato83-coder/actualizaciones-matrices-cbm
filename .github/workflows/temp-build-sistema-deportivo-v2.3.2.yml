name: TEMP Build SISTEMA DEPORTIVO v2.4.0 FINAL

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: build-sistema-deportivo-v2-4-0

      - name: Rebuild final v2.4.0 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build-sistema-deportivo-v2.4.0-final/source.part*" | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Paquete fuente final v2.4.0 incompleto: se esperaban 5 partes" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("source-v2.4.0-final.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Path "app-v240" -Force | Out-Null
          Expand-Archive -Path "source-v2.4.0-final.zip" -DestinationPath "app-v240" -Force
          if (!(Test-Path "app-v240/package.json")) { throw "No se pudo reconstruir package.json" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        working-directory: app-v240
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/store.js
          node --check src/security.js

      - name: Install dependencies
        working-directory: app-v240
        run: npm install

      - name: Test XLSX engine
        working-directory: app-v240
        shell: pwsh
        run: |
          @'
          const fs=require('fs');
          const XLSX=require('xlsx');
          const wb=XLSX.utils.book_new();
          for(const n of ['EQUIPOS','JUGADORES','DIRECTIVA','ARBITROS']) XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Campo'],['Demo']]),n);
          const f='test-import.xlsx'; XLSX.writeFile(wb,f);
          const b=XLSX.read(fs.readFileSync(f),{type:'buffer'});
          if(!b||!b.Sheets||['EQUIPOS','JUGADORES','DIRECTIVA','ARBITROS'].some(n=>!b.Sheets[n])) throw new Error('Falló prueba XLSX');
          fs.unlinkSync(f);
          console.log('XLSX OK');
          '@ | Set-Content test-xlsx.js -Encoding UTF8
          node test-xlsx.js
          Remove-Item test-xlsx.js -Force

      - name: Verify v2.4.0 functional integration
        working-directory: app-v240
        shell: pwsh
        run: |
          $m = Get-Content src/main.js -Raw
          $r = Get-Content src/renderer.js -Raw
          $p = Get-Content src/preload.js -Raw
          if ($m -match 'Próximamente' -or $r -match 'Próximamente') { throw 'Aún existen módulos marcados Próximamente' }
          foreach($needle in @("ipcMain.handle('audit:list'","ipcMain.handle('stats:exportExcel'","ipcMain.handle('formats:refereeAssignments'","ipcMain.handle('fixture:advance'","ipcMain.handle('backup:restoreConfirm'","ipcMain.handle('update:create'")) { if (!$m.Contains($needle)) { throw "Falta integración: $needle" } }
          foreach($needle in @('exportStatsExcel','exportStatsDocument','restoreJsonConfirm','generateRefereeAssignments','auditList','diagnostics','createUpdate')) { if (!$p.Contains($needle)) { throw "Falta API preload: $needle" } }
          $handlers = [regex]::Matches($m,"ipcMain\.handle\('([^']+)'") | ForEach-Object { $_.Groups[1].Value }
          $dups = $handlers | Group-Object | Where-Object Count -gt 1
          if ($dups) { throw ('IPC duplicados: ' + (($dups | ForEach-Object Name) -join ', ')) }
          Write-Host 'Integración funcional v2.4.0 OK'

      - name: Patch ExcelJS reader for Node 22
        shell: pwsh
        run: |
          $file = "app-v240/node_modules/exceljs/lib/utils/iterate-stream.js"
          if (!(Test-Path $file)) { throw "No se encontró iterate-stream.js de ExcelJS" }
          @'
          module.exports = async function* iterateStream(stream) {
            const contents = [];
            const HIGH_WATER_MARK = 64;
            const LOW_WATER_MARK = 16;
            stream.on('data', data => { contents.push(data); if (contents.length >= HIGH_WATER_MARK) stream.pause(); });
            let resolveStreamEndedPromise;
            const streamEndedPromise = new Promise(resolve => (resolveStreamEndedPromise = resolve));
            let ended = false;
            stream.on('end', () => { ended = true; resolveStreamEndedPromise(); });
            let error = false;
            stream.on('error', err => { error = err; resolveStreamEndedPromise(); });
            while (!ended || contents.length > 0) {
              if (contents.length === 0) { stream.resume(); await Promise.race([once(stream, 'data'), streamEndedPromise]); }
              else { const data = contents.shift(); if (contents.length <= LOW_WATER_MARK) stream.resume(); yield data; }
              if (error) throw error;
            }
            resolveStreamEndedPromise();
          };
          function once(eventEmitter, type) {
            return new Promise(resolve => {
              let fired = false;
              const handler = () => { if (!fired) { fired = true; eventEmitter.removeListener(type, handler); resolve(); } };
              eventEmitter.addListener(type, handler);
            });
          }
          '@ | Set-Content $file -Encoding UTF8

      - name: Build protected installer and portable
        working-directory: app-v240
        run: npm run dist:protected

      - name: Verify executables
        shell: pwsh
        run: |
          $files = Get-ChildItem "app-v240/dist-protected/*.exe"
          if ($files.Count -lt 2) { throw "No se generaron instalador y portable" }
          $files | ForEach-Object { Write-Host $_.Name $_.Length }

      - name: Upload installer and portable
        uses: actions/upload-artifact@v4
        with:
          name: SISTEMA_DEPORTIVO_Windows_v2.4.0_FINAL_PROTEGIDO
          path: app-v240/dist-protected/*.exe
          if-no-files-found: error
