name: TEMP Build SISTEMA DEPORTIVO v2.2.0

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
        with:
          ref: build-sistema-deportivo-v2-1-0

      - name: Rebuild complete v2.2.0 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build-sistema-deportivo-v2.1.0/source-v2.2.0/patch.part*" | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Paquete principal v2.2.0 incompleto" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("v220_patch.tar.xz", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Path "app-v220" -Force | Out-Null
          python -c "import tarfile; tarfile.open('v220_patch.tar.xz','r:xz').extractall('app-v220')"
          New-Item -ItemType Directory -Path "app-v220/src" -Force | Out-Null
          Copy-Item "build-sistema-deportivo-v2.1.0/static-v2.2.0/security.js" "app-v220/src/security.js" -Force
          Copy-Item "build-sistema-deportivo-v2.1.0/static-v2.2.0/admin-bootstrap.json" "app-v220/src/admin-bootstrap.json" -Force
          Copy-Item "build-sistema-deportivo-v2.1.0/static-v2.2.0/index.html" "app-v220/src/index.html" -Force
          Copy-Item "build-sistema-deportivo-v2.1.0/static-v2.2.0/styles.css" "app-v220/src/styles.css" -Force
          if (!(Test-Path "app-v220/package.json")) { throw "No se pudo reconstruir package.json" }
          if (!(Test-Path "app-v220/src/main.js")) { throw "No se pudo reconstruir main.js" }
          Write-Host "Fuente v2.2.0 reconstruida correctamente"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        working-directory: app-v220
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/store.js
          node --check src/security.js

      - name: Install dependencies
        working-directory: app-v220
        run: npm install

      - name: Build protected installer and portable
        working-directory: app-v220
        run: npm run dist:protected

      - name: Verify executables
        shell: pwsh
        run: |
          $files = Get-ChildItem "app-v220/dist-protected/*.exe"
          if ($files.Count -lt 2) { throw "No se generaron ambos ejecutables" }
          $files | ForEach-Object { Write-Host $_.Name $_.Length }

      - name: Upload installer and portable
        uses: actions/upload-artifact@v4
        with:
          name: SISTEMA_DEPORTIVO_Windows_v2.2.0_PROTEGIDO
          path: app-v220/dist-protected/*.exe
          if-no-files-found: error
