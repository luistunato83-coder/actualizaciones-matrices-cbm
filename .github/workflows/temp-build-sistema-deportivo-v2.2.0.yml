name: TEMP Build SISTEMA DEPORTIVO v2.2.0

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
        with:
          ref: build-sistema-deportivo-v2-1-0

      - name: Rebuild complete v2.2.0 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build-sistema-deportivo-v2.1.0/full-v2.2.0/source.part*" | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Paquete fuente v2.2.0 incompleto" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("source-v2.2.0.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Path "rebuild-v220" -Force | Out-Null
          Expand-Archive -Path "source-v2.2.0.zip" -DestinationPath "rebuild-v220" -Force
          $pkg = Get-ChildItem "rebuild-v220" -Recurse -Filter package.json | Select-Object -First 1
          if (!$pkg) { throw "No se encontró package.json del código v2.2.0" }
          $srcDir = $pkg.Directory.FullName
          Write-Host "Proyecto localizado en: $srcDir"
          New-Item -ItemType Directory -Path "app-v220" -Force | Out-Null
          Copy-Item "$srcDir/*" "app-v220" -Recurse -Force
          if (!(Test-Path "app-v220/package.json")) { throw "No se pudo preparar app-v220" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        working-directory: app-v220
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/store.js
          node --check src/security.js

      - name: Install dependencies
        working-directory: app-v220
        run: npm install

      - name: Build protected installer and portable
        working-directory: app-v220
        run: npm run dist:protected

      - name: Verify executables
        shell: pwsh
        run: |
          $files = Get-ChildItem "app-v220/dist-protected/*.exe"
          if ($files.Count -lt 2) { throw "No se generaron ambos ejecutables" }
          $files | ForEach-Object { Write-Host $_.Name $_.Length }

      - name: Upload installer and portable
        uses: actions/upload-artifact@v4
        with:
          name: SISTEMA_DEPORTIVO_Windows_v2.2.0_PROTEGIDO
          path: app-v220/dist-protected/*.exe
          if-no-files-found: error
