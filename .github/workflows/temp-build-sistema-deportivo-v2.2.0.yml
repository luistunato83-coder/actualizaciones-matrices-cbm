name: TEMP Build SISTEMA DEPORTIVO v2.3.1

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
        with:
          ref: build-sistema-deportivo-v2-3-1

      - name: Rebuild complete v2.3.0 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build-sistema-deportivo-v2.3.0/source.part*" | Sort-Object Name
          if ($parts.Count -ne 3) { throw "Paquete fuente v2.3.0 incompleto" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("source-v2.3.0.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Path "app-v231" -Force | Out-Null
          Expand-Archive -Path "source-v2.3.0.zip" -DestinationPath "app-v231" -Force
          if (!(Test-Path "app-v231/package.json")) { throw "No se pudo reconstruir package.json" }
          if (!(Test-Path "app-v231/src/main.js")) { throw "No se pudo reconstruir main.js" }

      - name: Apply v2.3.1 secure admin recovery changes
        shell: pwsh
        run: |
          function Decode([string]$s) { [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($s)) }

          $mainPath = "app-v231/src/main.js"
          $main = Get-Content $mainPath -Raw
          $storeOld = Decode "bGV0IHN0b3JlLG1vZGU9J3VzZXInO2NvbnN0IEQ9KCk9PnN0b3JlLmRhdGEsYnlJZD0oYSxpZCk9PmEuZmluZCh4PT5OdW1iZXIoeC5pZCk9PT1OdW1iZXIoaWQpKSxuZXh0SWQ9az0+c3RvcmUubmV4dChrKTs="
          $storeNew = Decode "bGV0IHN0b3JlLG1vZGU9J3VzZXInLGFkbWluUmVjb3ZlcnlBdXRob3JpemVkVW50aWw9MDtjb25zdCBEPSgpPT5zdG9yZS5kYXRhLGJ5SWQ9KGEsaWQpPT5hLmZpbmQoeD0+TnVtYmVyKHguaWQpPT09TnVtYmVyKGlkKSksbmV4dElkPWs9PnN0b3JlLm5leHQoayk7"
          if (!$main.Contains($storeOld)) { throw "No se encontró la declaración de estado del Administrador" }
          $main = $main.Replace($storeOld,$storeNew)

          $prov = Decode ""
          $reset = Decode ""
          if (!$main.Contains($prov)) { throw "No se encontró el alta inicial del Administrador" }
          $main = $main.Replace($prov,$prov + "`n" + $reset)

          $masterOld = Decode ""
          $masterNew = Decode ""
          if (!$main.Contains($masterOld)) { throw "No se encontró la instalación de Clave Maestra" }
          $main = $main.Replace($masterOld,$masterNew)
          Set-Content $mainPath $main -Encoding UTF8

          $preloadNew = Decode ""
          Set-Content "app-v231/src/preload.js" $preloadNew -Encoding UTF8

          $rendererPath = "app-v231/src/renderer.js"
          $renderer = Get-Content $rendererPath -Raw
          $rendererOld = Decode ""
          $rendererNew = Decode ""
          if (!$renderer.Contains($rendererOld)) { throw "No se encontró el bloque de acceso del Administrador" }
          $renderer = $renderer.Replace($rendererOld,$rendererNew)
          Set-Content $rendererPath $renderer -Encoding UTF8

          $pkgPath = "app-v231/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = "2.3.1"
          $pkg.description = "SISTEMA DEPORTIVO v2.3.1 offline con licencia obligatoria por dispositivo, Administrador propietario protegido y recuperación mediante Clave Maestra."
          $pkg | ConvertTo-Json -Depth 20 | Set-Content $pkgPath -Encoding UTF8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        working-directory: app-v231
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/store.js
          node --check src/security.js

      - name: Install dependencies
        working-directory: app-v231
        run: npm install

      - name: Build protected installer and portable
        working-directory: app-v231
        run: npm run dist:protected

      - name: Verify executables
        shell: pwsh
        run: |
          $files = Get-ChildItem "app-v231/dist-protected/*.exe"
          if ($files.Count -lt 2) { throw "No se generaron ambos ejecutables" }
          $files | ForEach-Object { Write-Host $_.Name $_.Length }

      - name: Upload installer and portable
        uses: actions/upload-artifact@v4
        with:
          name: SISTEMA_DEPORTIVO_Windows_v2.3.1_PROTEGIDO
          path: app-v231/dist-protected/*.exe
          if-no-files-found: error
