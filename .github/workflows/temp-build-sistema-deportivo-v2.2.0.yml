name: TEMP Build SISTEMA DEPORTIVO v2.3.0

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
        with:
          ref: build-sistema-deportivo-v2-3-0

      - name: Rebuild complete v2.3.0 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build-sistema-deportivo-v2.3.0/source.part*" | Sort-Object Name
          if ($parts.Count -ne 3) { throw "Paquete fuente v2.3.0 incompleto" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("source-v2.3.0.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Path "app-v230" -Force | Out-Null
          Expand-Archive -Path "source-v2.3.0.zip" -DestinationPath "app-v230" -Force
          if (!(Test-Path "app-v230/package.json")) { throw "No se pudo reconstruir package.json" }
          if (!(Test-Path "app-v230/src/main.js")) { throw "No se pudo reconstruir main.js" }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        working-directory: app-v230
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/store.js
          node --check src/security.js

      - name: Install dependencies
        working-directory: app-v230
        run: npm install

      - name: Build protected installer and portable
        working-directory: app-v230
        run: npm run dist:protected

      - name: Verify executables
        shell: pwsh
        run: |
          $files = Get-ChildItem "app-v230/dist-protected/*.exe"
          if ($files.Count -lt 2) { throw "No se generaron ambos ejecutables" }
          $files | ForEach-Object { Write-Host $_.Name $_.Length }

      - name: Upload installer and portable
        uses: actions/upload-artifact@v4
        with:
          name: SISTEMA_DEPORTIVO_Windows_v2.3.0_PROTEGIDO
          path: app-v230/dist-protected/*.exe
          if-no-files-found: error
