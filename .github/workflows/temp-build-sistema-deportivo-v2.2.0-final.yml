name: TEMP Build SISTEMA DEPORTIVO v2.2.0 FINAL

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout final build branch
        uses: actions/checkout@v4
        with:
          ref: build-sistema-deportivo-v2-2-0-final

      - name: Rebuild final v2.2.0 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build-sistema-deportivo-v2.2.0-final/source.part*" | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $b64 = [regex]::Replace($b64, '[^A-Za-z0-9+/=]', '')
          if ($b64.Length -ne 36388) { throw "Base64 inesperado: $($b64.Length)" }
          [IO.File]::WriteAllBytes("source-final.zip", [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash "source-final.zip" -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "a860c816a7eff8a1c90aa6e80d6641e245954a33de89a1ea13afc409344fa12c") { throw "SHA256 de fuente no coincide: $sha" }
          Expand-Archive -Path "source-final.zip" -DestinationPath "." -Force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check original source
        working-directory: sistema-deportivo-v2.2.0
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/security.js
          node --check src/store.js

      - name: Install dependencies
        working-directory: sistema-deportivo-v2.2.0
        run: npm install

      - name: Add source protection tooling
        working-directory: sistema-deportivo-v2.2.0
        run: npm install --no-save javascript-obfuscator@4.1.1

      - name: Obfuscate executable JavaScript
        shell: pwsh
        working-directory: sistema-deportivo-v2.2.0
        run: |
          $files = @('src/main.js','src/preload.js','src/renderer.js','src/security.js','src/store.js')
          foreach ($f in $files) {
            $tmp = "$f.obf.js"
            npx javascript-obfuscator $f --output $tmp --compact true --control-flow-flattening true --control-flow-flattening-threshold 0.35 --dead-code-injection true --dead-code-injection-threshold 0.15 --string-array true --string-array-encoding base64 --string-array-threshold 0.8 --rename-globals false --self-defending true
            Move-Item -Force $tmp $f
            node --check $f
          }

      - name: Build installer and portable
        working-directory: sistema-deportivo-v2.2.0
        run: npm run dist

      - name: Verify executables
        shell: pwsh
        run: |
          $files = Get-ChildItem "sistema-deportivo-v2.2.0/dist/*.exe"
          if ($files.Count -lt 2) { throw "No se generaron Instalador y Portable." }
          $files | ForEach-Object { Write-Host $_.Name $_.Length }

      - name: Upload installer and portable
        uses: actions/upload-artifact@v4
        with:
          name: SISTEMA_DEPORTIVO_Windows_v2.2.0_FINAL
          path: sistema-deportivo-v2.2.0/dist/*.exe
          if-no-files-found: error
